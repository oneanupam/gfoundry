[project]
name = "gcp_tools"
version = "0.1.0"
description = "GCP Tools is a Python package that provides a set of utilities for interacting with Google Cloud Platform (GCP) services."
readme = "README.md"
authors = [
    { name = "Anupam", email = "anupaminit@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "google-cloud-compute>=1.51.0",
    "google-cloud-iam==2.25.0",
    "google-cloud-resource-manager>=1.10.1",
    "google-cloud-kms>=2.0.0",
    "requests>=2.34.2",
    "logging>=0.4.9.6",
    "pyyaml>=6.0.3",
]

[project.scripts]
gcp_tools = "gcp_tools.cli:main"

[build-system]
requires = ["uv_build>=0.12.7,<0.13.0"]
build-backend = "uv_build"
